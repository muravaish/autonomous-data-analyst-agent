name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate Python project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python files
        run: |
          python -m py_compile \
            agent_graph.py \
            app.py \
            business_rules.py \
            db_adapter.py \
            decision_enrichment.py \
            eval_harness.py \
            faithfulness_harness.py \
            explore_schema.py \
            load_data.py \
            run_batch.py \
            run_query.py \
            sql_agent.py \
            test_api.py

      - name: Run deterministic decision enrichment
        run: python decision_enrichment.py
      - name: Validate Docker image builds
        run: docker build -t autonomous-data-analyst-agent:ci .

